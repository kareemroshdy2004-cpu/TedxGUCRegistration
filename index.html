<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your TEDxGUC 2026 Ticket</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #E62B1E; --gold: #C9A227;
    --bg: #EDEDED; --card: #FFFFFF; --panel: #F7F7F7; --text: #1D1D1D; --muted: #6B6B6B; --accent: #E62B1E;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: Archivo, Helvetica, Arial, sans-serif; }
  body.vip { --bg: #0F0D0A; --card: #1A1712; --panel: #241F17; --text: #F5ECD7; --muted: #BFAE85; --accent: #C9A227; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 20px 16px 32px; }
  .card { background: var(--card); border: 2px solid var(--accent); border-radius: 16px; overflow: hidden; }
  .bar { height: 8px; background: var(--accent); }
  .top { padding: 28px 24px 8px; text-align: center; }
  .logo { font-size: 32px; letter-spacing: -1px; color: var(--red); }
  .logo b { font-weight: 900; }
  .logo span { color: var(--text); font-weight: 300; }
  h1 { margin: 16px 0 6px; font-size: 22px; }
  .sub { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
  .badge { display: inline-block; padding: 8px 22px; border-radius: 30px; font-weight: 800; letter-spacing: 2px; font-size: 15px; }
  .badge.vip { background: linear-gradient(135deg,#F3D57A,#C9A227,#9C7A14); color: #1A1712; }
  .badge.regular { background: var(--red); color: #fff; }
  .qrbox { text-align: center; padding: 22px 24px 6px; }
  .qr { display: inline-block; background: #fff; padding: 14px; border-radius: 12px; border: 3px solid var(--accent); }
  .qr img { display: block; width: 240px; height: 240px; max-width: 100%; }
  .label { margin-top: 14px; font-size: 12px; color: var(--muted); letter-spacing: 1px; }
  .code { font-size: 26px; font-weight: 800; color: var(--accent); letter-spacing: 3px; font-family: 'Courier New', monospace; }
  .hint { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .panel { margin: 20px 24px; background: var(--panel); border-radius: 10px; padding: 16px 20px; }
  .panel .k { font-size: 13px; color: var(--accent); font-weight: 700; margin-bottom: 4px; }
  .panel .v { font-size: 15px; margin-bottom: 12px; }
  .panel .v:last-child { margin-bottom: 0; }
  .details { padding: 0 24px 20px; }
  .details .k { font-size: 13px; color: var(--accent); font-weight: 700; margin-bottom: 4px; }
  table { width: 100%; border-collapse: collapse; border-top: 1px solid var(--accent); }
  td { padding: 8px 0; font-size: 14px; vertical-align: top; }
  td:first-child { color: var(--muted); width: 40%; font-size: 13px; }
  td:last-child { font-weight: 600; word-break: break-word; }
  .foot { padding: 16px 24px 26px; text-align: center; color: var(--muted); font-size: 12px; border-top: 1px solid var(--accent); }
  .powered { margin-top: 18px; font-size: 11px; letter-spacing: 2px; }
  .powered img { display: block; margin: 8px auto 0; width: 170px; height: auto; }
  .find { background: #fff; border: 2px solid var(--red); border-radius: 16px; padding: 28px 22px; text-align: center; margin-top: 8vh; }
  .find h1 { margin: 14px 0 6px; }
  .find p { color: var(--muted); font-size: 14px; margin: 0 0 18px; line-height: 1.5; }
  .find input { width: 100%; font: inherit; font-size: 16px; padding: 14px; border-radius: 10px; border: 2px solid #ddd; margin-bottom: 12px; }
  .find input:focus-visible { outline: 3px solid var(--gold); outline-offset: 1px; border-color: var(--red); }
  .btn { display: block; width: 100%; font: inherit; font-size: 16px; font-weight: 700; padding: 14px; border: 0;
         border-radius: 30px; background: var(--red); color: #fff; cursor: pointer; text-decoration: none; }
  .btn:disabled { opacity: .6; }
  .btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .err { color: #C0261B; min-height: 1.3em; margin-top: 12px; font-size: 14px; }
  .pick { display: grid; gap: 10px; margin-top: 16px; }
  .back { display: inline-block; margin: 0 0 14px; color: var(--muted); font-size: 14px; }
  .state { text-align: center; padding: 80px 20px; color: var(--muted); font-size: 16px; }
  .spinner { width: 42px; height: 42px; margin: 0 auto 16px; border-radius: 50%; border: 4px solid rgba(0,0,0,.12); border-top-color: var(--red); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>

  const $app = document.getElementById('app');
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const brand = s => esc(s).replace(/TEDxGUC/g, '<b>TEDx</b><span style="font-weight:400">GUC</span>');

  function fail(msg) {
    $app.innerHTML = '<div class="state">' + esc(msg) + '<br><br>If you think this is a mistake, contact the TEDxGUC team.</div>';
  }

  function showFind(msg) {
    document.body.classList.remove('vip');
    $app.innerHTML = `
      <form class="find" id="findForm" novalidate>
        <div class="logo"><b>TEDx</b><span>GUC</span></div>
        <h1>Get your ticket</h1>
        <p>Enter the email address you registered with to open your ticket and QR code.</p>
        <label for="em" style="position:absolute;left:-9999px;">Email address</label>
        <input id="em" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" required>
        <button class="btn" id="go" type="submit">Show my ticket</button>
        <div class="err" id="err" role="alert">${esc(msg || '')}</div>
        <div class="pick" id="pick"></div>
      </form>`;
    document.getElementById('findForm').onsubmit = async ev => {
      ev.preventDefault();
      const email = document.getElementById('em').value.trim();
      const err = document.getElementById('err'), go = document.getElementById('go'), pick = document.getElementById('pick');
      pick.innerHTML = '';
      if (!email) { err.textContent = 'Please enter your email.'; return; }
      go.disabled = true; err.textContent = 'Searching…';
      try {
        const r = await fetch(WEB_APP_URL + '?action=find&email=' + encodeURIComponent(email));
        const res = await r.json();
        if (!res.ok) { err.textContent = res.message || 'No ticket found.'; go.disabled = false; return; }
        if (res.tickets.length === 1) return openTicket(res.tickets[0]);
        err.textContent = 'You have ' + res.tickets.length + ' tickets. Choose one:';
        res.tickets.forEach(t => {
          const b = document.createElement('button');
          b.type = 'button'; b.className = 'btn';
          b.textContent = (t.name || 'Ticket') + ' – ' + t.code + (t.type ? ' (' + t.type + ')' : '');
          b.onclick = () => openTicket(t);
          pick.appendChild(b);
        });
      } catch (e) {
        err.textContent = 'Could not connect. Check your internet and try again.';
      }
      go.disabled = false;
    };
  }

  function openTicket(t) {
    location.href = location.pathname + '?c=' + encodeURIComponent(t.code) + '&k=' + encodeURIComponent(t.key);
  }

  async function load() {
    const q = new URLSearchParams(location.search);
    const code = q.get('c'), key = q.get('k');
    if (!code || !key) return showFind();
    try {
      const r = await fetch(WEB_APP_URL + '?action=ticket&code=' + encodeURIComponent(code) + '&key=' + encodeURIComponent(key));
      const res = await r.json();
      if (!res.ok) return fail(res.message || 'Ticket not found.');
      render(res.ticket, res.event);
    } catch (e) {
      fail('Could not load your ticket. Check your internet connection and refresh the page.');
    }
  }

  function render(t, ev) {
    const vip = t.type === 'VIP';
    document.body.classList.toggle('vip', vip);
    document.title = 'Your ' + t.type + ' ticket – ' + ev.name;

    // Exactly the same QR content as the ticket email, so the door scanner accepts it
    const qrData = [
      ev.name + ' TICKET',
      'Code: ' + t.code,
      'Name: ' + t.name,
      'Phone: ' + t.phone,
      'GUCian: ' + (t.gucian ? 'Yes' + (t.gucId ? ' (' + t.gucId + ')' : '') : 'No'),
      'Type: ' + t.type,
      'Key: ' + t.key
    ].join('\n');
    const qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=500x500&margin=12&ecc=M&data=' + encodeURIComponent(qrData);

    const row = (k, v) => '<tr><td>' + k + '</td><td>' + esc(v) + '</td></tr>';
    $app.innerHTML = `
      <a class="back" href="${location.pathname}">&larr; Find another ticket</a>
      <div class="card">
        <div class="bar"></div>
        <div class="top">
          <div class="logo"><b>TEDx</b><span>GUC</span></div>
          <h1>Thank you for registering, ${esc(String(t.name).split(' ')[0])}!</h1>
          <p class="sub">Your spot at ${brand(ev.name)} is confirmed. Show this QR code at the entrance.</p>
          <span class="badge ${vip ? 'vip' : 'regular'}">${vip ? '&#9733; VIP TICKET &#9733;' : 'REGULAR TICKET'}</span>
        </div>
        <div class="qrbox">
          <div class="qr"><img src="${qrUrl}" alt="Ticket QR code"></div>
          <div class="label">TICKET NUMBER</div>
          <div class="code">${esc(t.code)}</div>
          <div class="hint">Tip: take a screenshot of this page so you have it offline.</div>
        </div>
        <div class="panel">
          <div class="k">Date</div><div class="v">${esc(ev.date)}</div>
          <div class="k">Location</div><div class="v">${esc(ev.location)}</div>
        </div>
        <div class="details">
          <div class="k">Your registration details</div>
          <table>
            ${row('Name', t.name)}
            ${row('Email', t.email)}
            ${row('Phone', t.phone)}
            ${row('GUCian', t.gucian ? 'Yes' : 'No')}
            ${t.gucian && t.gucId ? row('GUC ID', t.gucId) : ''}
            ${row('Guest type', t.attendeeType)}
            ${row('Ticket type', t.type)}
            ${row('Registered at', t.registeredAt)}
          </table>
        </div>
        <div class="foot">
          This ticket is personal and valid for one entry only. Please don't share your QR code.<br>
          See you there! &mdash; The ${brand(ev.name)} Team
          <div class="powered">POWERED BY<img src="${vip ? LOGO_WHITE : LOGO_BLACK}" alt="SOUEAST"></div>
        </div>
      </div>`;
  }

  load();
</script>
</body>
</html>
